<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>閱讀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #14171c;
    color: #e9e4d8;
    font-family: system-ui, sans-serif;
    /* 底部留空間給固定的導覽列 */
    padding-bottom: 4.5rem;
  }

  #wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 2rem;
  }

  #title {
    font-size: 1.1rem;
    margin: 0 0 1.5rem;
  }

  #status {
    color: #9d9788;
    font-size: 0.9rem;
  }

  #content {
    font-family: "Noto Serif SC", serif;
    font-size: 1.08rem;
    line-height: 1.95;
  }

  #content p {
    margin: 0 0 1.15em;
  }

  /* 底部固定導覽列：永遠貼在螢幕底部，不隨內容捲動 */
  #navbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    background: #1b2027;
    border-top: 1px solid #2c333c;
  }

  #navbar button {
    flex: 1 1 0;
    font-family: inherit;
    font-size: 0.9rem;
    color: #e9e4d8;
    background: #20262e;
    border: 1px solid #2c333c;
    border-radius: 6px;
    padding: 0.6rem 0.5rem;
    cursor: pointer;
  }

  #navbar button:hover:not(:disabled),
  #navbar button:focus-visible {
    border-color: #c9822f;
  }

  #navbar button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div id="wrap">
  <h1 id="title"></h1>
  <div id="content"><p id="status">讀取中…</p></div>
</div>

<div id="navbar">
  <button id="btn-prev" type="button">‹ 上一話</button>
  <button id="btn-toc" type="button">目錄</button>
  <button id="btn-next" type="button">下一話 ›</button>
</div>

<script src="common.js"></script>
<script>
  const folder = getQueryParam("folder");
  const file = getQueryParam("file");

  document.getElementById("btn-toc").addEventListener("click", () => {
    location.href = `toc.html?folder=${encodeURIComponent(folder)}`;
  });

  function goTo(chapter) {
    location.href =
      `reader.html?folder=${encodeURIComponent(folder)}&file=${encodeURIComponent(chapter.name)}`;
  }

  function textToParagraphs(text) {
    const paragraphs = text
      .replace(/\r\n/g, "\n")
      .split(/\n{2,}/)
      .map((p) => p.trim())
      .filter((p) => p.length > 0);

    if (paragraphs.length === 0) return "<p><em>（這一話沒有內容）</em></p>";
    return paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join("\n");
  }

  async function init() {
    const contentEl = document.getElementById("content");
    const titleEl = document.getElementById("title");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    if (!folder || !file) {
      contentEl.innerHTML = "<p>缺少 folder 或 file 參數。</p>";
      return;
    }

    // 優先用 toc.html 存好的清單，省一次 API 請求；沒有的話再重新抓一次。
    let chapters = getCachedChapterList(folder);
    if (!chapters) {
      try {
        const items = await fetchDirListing(`files/${folder}`);
        chapters = sortChapterFiles(items);
        cacheChapterList(folder, chapters);
      } catch (err) {
        contentEl.innerHTML = `<p>${escapeHtml(err.message)}</p>`;
        return;
      }
    }

    const index = chapters.findIndex((c) => c.name === file);
    if (index === -1) {
      contentEl.innerHTML = "<p>找不到這一話。</p>";
      return;
    }

    const chapter = chapters[index];
    titleEl.textContent = chapter.title;

    btnPrev.disabled = index <= 0;
    btnNext.disabled = index >= chapters.length - 1;
    btnPrev.addEventListener("click", () => {
      if (index > 0) goTo(chapters[index - 1]);
    });
    btnNext.addEventListener("click", () => {
      if (index < chapters.length - 1) goTo(chapters[index + 1]);
    });

    try {
      const res = await fetch(chapter.download_url, { cache: "force-cache" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      contentEl.innerHTML = textToParagraphs(text);
    } catch (err) {
      contentEl.innerHTML = `<p>載入內容失敗：${escapeHtml(err.message)}</p>`;
    }
  }

  init();
</script>
</body>
</html>
